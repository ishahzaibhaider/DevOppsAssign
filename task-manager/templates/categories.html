{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>New Category</h2>
    <form method="POST">
        <div>
            <label for="name">Category Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <button type="submit">Add Category</button>
    </form>
</div>

<div class="card">
    <h2>My Categories</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.name }}</td>
                <td>
                    <a href="{{ url_for('delete_category', id=category.id) }}" class="btn-small btn-danger" onclick="return confirm('Are you sure? This will not delete associated tasks.')">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2">No categories found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
